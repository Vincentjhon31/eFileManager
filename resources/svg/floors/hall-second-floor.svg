<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="Plan of the second floor of the Bongabong municipal hall">

  <!--
    Second floor, Bongabong municipal hall.

    Traced from docs/floor-plans/Mayor's_Office.png, which is kept alongside so
    this can be redrawn from the original without asking the LGU for it again.

    THREE RULES FOR ANYONE REDRAWING THIS FILE

    1. Every room shape keeps its `id`. That one string is the whole coupling
       between this drawing and the database — rooms.svg_shape_id. Rename an id
       and that room stops lighting up; keep it and you may move, reshape or
       restyle anything you like without touching a line of code.

    2. Room fills are presentation attributes (fill="…"), never inline styles.
       Door state is applied by a generated stylesheet targeting these ids, and
       an inline style would beat it and freeze the room grey forever.

    3. No script, no external references, no <image>. This file is inlined into
       an authenticated page; anything it can fetch, it fetches as the user.

    Deliberately schematic. The furniture in the original is left out because
    this is read as a status board, not an interiors drawing — and a room tinted
    amber for "work waiting" is harder to read with a conference table drawn
    across it. The original PNG remains the reference for anyone who needs one.
  -->

  <defs>
    <pattern id="hatch-stairs" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0,0 H14" stroke="#94a3b8" stroke-width="2" fill="none"/>
    </pattern>
  </defs>

  <!-- The floor slab. Anything not covered by a room below reads as corridor. -->
  <path id="floor-outline"
        d="M122,5 H1010 V220 H1170 V435 H1590 V995 H890 V1090 H40 V440 H15 V150 H122 Z"
        fill="#f8fafc" stroke="#0f172a" stroke-width="7" stroke-linejoin="round"/>

  <g id="rooms" stroke="#475569" stroke-width="3" stroke-linejoin="round">

    <!-- ── North range ─────────────────────────────────────────────────── -->

    <path id="room-it-room" class="room" fill="#f1f5f9"
          d="M122,5 H300 V145 H122 Z"><title>IT Room</title></path>

    <path id="room-elevator" class="room" fill="#e2e8f0"
          d="M515,5 H605 V45 H515 Z"><title>Elevator</title></path>

    <path id="room-entrance-stairs" class="room" fill="#e2e8f0"
          d="M730,5 H1010 V195 H730 Z"><title>Entrance and exit stairs</title></path>

    <!-- Sangguniang Bayan chamber, with the rostrum bay on the west wall. -->
    <path id="room-sb-session-hall" class="room" fill="#f1f5f9"
          d="M15,150 H122 V140 H610 V435 H122 V385 H15 Z"><title>SB Session Hall</title></path>

    <path id="room-public-assistance" class="room" fill="#f1f5f9"
          d="M830,225 H1015 V395 H830 Z"><title>Public Assistance Desk</title></path>

    <path id="room-balcony" class="room" fill="#e2e8f0"
          d="M1018,245 H1170 V395 H1018 Z"><title>Balcony</title></path>

    <!-- ── Central range ───────────────────────────────────────────────── -->

    <path id="room-lobby" class="room" fill="#e2e8f0"
          d="M700,435 H805 V560 H700 Z"><title>Main entrance lobby</title></path>

    <path id="room-visitors-waiting" class="room" fill="#f1f5f9"
          d="M805,435 H1250 V507 H805 Z"><title>Visitors' Waiting Area</title></path>

    <path id="room-east-corridor" class="room" fill="#e2e8f0"
          d="M1250,435 H1290 V995 H1250 Z"><title>Corridor</title></path>

    <path id="room-conference-hall" class="room" fill="#f1f5f9"
          d="M1290,435 H1590 V995 H1290 Z"><title>Conference Hall</title></path>

    <!-- ── West range ──────────────────────────────────────────────────── -->

    <path id="room-female-cr" class="room" fill="#e2e8f0"
          d="M40,440 H135 V600 H40 Z"><title>Female comfort room</title></path>

    <path id="room-male-cr" class="room" fill="#e2e8f0"
          d="M40,600 H185 V685 H40 Z"><title>Male comfort room</title></path>

    <path id="room-genderized-cr" class="room" fill="#e2e8f0"
          d="M40,685 H190 V840 H40 Z"><title>Genderized comfort room</title></path>

    <path id="room-exit-stairs" class="room" fill="#e2e8f0"
          d="M192,475 H262 V730 H192 Z"><title>Exit stairs</title></path>

    <path id="room-pantry" class="room" fill="#e2e8f0"
          d="M40,840 H258 V1090 H40 Z"><title>Pantry</title></path>

    <!-- ── South range ─────────────────────────────────────────────────── -->

    <!-- Open-plan, wrapping around the Secretary's room to the south-west. -->
    <path id="room-municipal-administrator" class="room" fill="#f1f5f9"
          d="M262,435 H700 V785 H520 V1090 H262 Z"><title>Office of the Municipal Administrator</title></path>

    <path id="room-secretary-administrator" class="room" fill="#f1f5f9"
          d="M520,785 H730 V1090 H520 Z"><title>Office of the Secretary and Administrator</title></path>

    <path id="room-front-desk" class="room" fill="#f1f5f9"
          d="M728,560 H890 V790 H728 Z"><title>Front Desk</title></path>

    <path id="room-mayors-pantry" class="room" fill="#e2e8f0"
          d="M735,790 H890 V870 H735 Z"><title>Mayor's Pantry</title></path>

    <path id="room-mayors-cr" class="room" fill="#e2e8f0"
          d="M735,870 H890 V1090 H735 Z"><title>Mayor's comfort room</title></path>

    <path id="room-mayors-office" class="room" fill="#f1f5f9"
          d="M890,560 H1280 V995 H890 Z"><title>Mayor's Office</title></path>
  </g>

  <!-- Orientation glyphs. Purely decorative; nothing reads or writes these. -->
  <g id="fixtures" aria-hidden="true" fill="none" stroke="#94a3b8" stroke-width="2.5">
    <rect x="742" y="20" width="256" height="160" fill="url(#hatch-stairs)" stroke="none"/>
    <path d="M870,20 V180 M742,100 H998" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="204" y="490" width="46" height="226" fill="url(#hatch-stairs)" stroke="none"/>
    <path d="M527,17 H593 M527,33 H593 M560,10 V40" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M700,428 a34,34 0 0 1 34,34" stroke="#0f172a" stroke-width="3"/>
  </g>

  <g id="labels" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
     text-anchor="middle" fill="#334155" aria-hidden="true">

    <text x="211" y="80" font-size="21" font-weight="600">IT ROOM</text>
    <text x="560" y="72" font-size="17">ELEVATOR</text>
    <text x="870" y="230" font-size="17">ENTRANCE / EXIT STAIRS</text>

    <text x="366" y="282" font-size="27" font-weight="600">SB SESSION HALL</text>

    <text x="922" y="305" font-size="17">PUBLIC<tspan x="922" dy="21">ASSISTANCE</tspan></text>
    <text x="1094" y="327" font-size="17">BALCONY</text>

    <text x="752" y="418" font-size="16">MAIN ENTRANCE</text>
    <text x="1027" y="478" font-size="18">VISITORS' WAITING AREA</text>
    <text x="1440" y="700" font-size="26" font-weight="600">CONFERENCE<tspan x="1440" dy="32">HALL</tspan></text>

    <text x="87" y="515" font-size="15">FEMALE<tspan x="87" dy="18">CR</tspan></text>
    <text x="112" y="648" font-size="15">MALE CR</text>
    <text x="115" y="755" font-size="15">GENDERIZED<tspan x="115" dy="18">CR</tspan></text>
    <text x="227" y="600" font-size="15" transform="rotate(-90 227 600)">EXIT STAIRS</text>
    <text x="149" y="972" font-size="18">PANTRY</text>

    <text x="481" y="545" font-size="19" font-weight="600">OFFICE OF THE MUNICIPAL<tspan x="481" dy="24">ADMINISTRATOR</tspan></text>
    <text x="625" y="920" font-size="17" font-weight="600">OFFICE OF THE<tspan x="625" dy="21">SECRETARY &amp;</tspan><tspan x="625" dy="21">ADMINISTRATOR</tspan></text>

    <text x="809" y="600" font-size="17" font-weight="600">FRONT<tspan x="809" dy="21">DESK</tspan></text>
    <text x="812" y="835" font-size="14">MAYOR'S PANTRY</text>
    <text x="812" y="985" font-size="15">MAYOR'S<tspan x="812" dy="18">CR</tspan></text>

    <text x="1085" y="785" font-size="28" font-weight="600">MAYOR'S OFFICE</text>
  </g>
</svg>
